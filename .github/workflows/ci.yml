name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ts:
    name: ts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: migrations match the schema
        run: |
          bun run generate
          git status --porcelain -- ':(glob)packages/*/migrations/**'
          test -z "$(git status --porcelain -- ':(glob)packages/*/migrations/**')"
      - name: table rebuilds are reviewed
        run: sh scripts/check-rebuild-migrations.sh
