name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ts:
    name: ts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      # 引用符で囲んだ pathspec は、generate が作った未追跡の新しい migration を見逃す。
      # テストの DB は migration の SQL から作るので、schema を変えて generate を忘れてもテストは通る。
      - name: migrations match the schema
        run: |
          bun run generate
          git status --porcelain -- packages/*/migrations
          test -z "$(git status --porcelain -- packages/*/migrations)"
      - name: table rebuilds are reviewed
        run: sh scripts/check-rebuild-migrations.sh
